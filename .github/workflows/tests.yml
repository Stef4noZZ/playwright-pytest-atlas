name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      markers:
        description: "Pytest marker expression for the browser jobs"
        type: string
        default: "smoke and not api"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.browser }} / py${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Playwright browser
        run: playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests
        env:
          QA_BROWSER: ${{ matrix.browser }}
          QA_HEADLESS: "true"
          PYTEST_MARKERS: ${{ github.event.inputs.markers || 'smoke and not api' }}
        run: |
          pytest \
            -m "$PYTEST_MARKERS" \
            --browser=${{ matrix.browser }} \
            -n auto \
            --reruns=1 \
            --reruns-delay=2

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.browser }}-py${{ matrix.python }}
          path: reports/
          retention-days: 14

  api:
    name: api smoke
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run API smoke tests
        env:
          QA_HEADLESS: "true"
        run: pytest -m "smoke and api" -n auto --reruns=1 --reruns-delay=2

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-api
          path: reports/
          retention-days: 14

  lint:
    name: lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check framework config tests

      - name: Ruff format check
        run: ruff format --check framework config tests

      - name: Mypy
        run: mypy framework config

      - name: Unit tests
        run: pytest tests/unit -q -p no:xdist
